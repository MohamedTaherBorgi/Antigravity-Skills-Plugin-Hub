<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="gradBlock1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="gradBlock2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="gradBlock3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gradSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Background Container -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#gradBg)" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>

  <!-- Module 1: Top-Left Skill Block -->
  <rect x="24" y="24" width="36" height="36" rx="10" fill="url(#gradBlock1)" opacity="0.95"/>
  <path d="M 36 42 L 48 42 M 42 36 L 42 48" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Module 2: Bottom-Left Skill Block -->
  <rect x="24" y="68" width="36" height="36" rx="10" fill="url(#gradBlock3)" opacity="0.95"/>
  <polyline points="34,88 42,80 50,88" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Module 3: Top-Right Skill Block -->
  <rect x="68" y="24" width="36" height="36" rx="10" fill="url(#gradBlock2)" opacity="0.95"/>
  <circle cx="86" cy="42" r="6" fill="none" stroke="#ffffff" stroke-width="3"/>

  <!-- Center Connecting Hub -->
  <circle cx="64" cy="64" r="14" fill="#0f172a" stroke="#6366f1" stroke-width="2.5" />
  <!-- Spark in Center -->
  <path d="M 64 56 Q 64 64 72 64 Q 64 64 64 72 Q 64 64 56 64 Q 64 64 64 56 Z" fill="url(#gradSpark)" filter="url(#glow)"/>

  <!-- Module 4: Bottom-Right Command Pill -->
  <rect x="68" y="68" width="36" height="36" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <text x="86" y="91" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle">/></text>
</svg>
